services:
  # Two API instances share ONE SQLite database file on a named volume, as the
  # task requires. SQLite has no network server: the file is the database. Both
  # containers mount the same volume at the same path so they see one file.
  api-1:
    build: .
    environment:
      DATABASE_URL: sqlite:////data/research.db
      SQLITE_BUSY_TIMEOUT_SECONDS: "30"
      IDEMPOTENCY_STALE_SECONDS: "60"
    volumes:
      - sqlite_data:/data
    ports:
      - "8001:8000"
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request;urllib.request.urlopen('http://127.0.0.1:8000/health',timeout=2)\""]
      interval: 3s
      timeout: 5s
      retries: 30

  api-2:
    build: .
    environment:
      DATABASE_URL: sqlite:////data/research.db
      SQLITE_BUSY_TIMEOUT_SECONDS: "30"
      IDEMPOTENCY_STALE_SECONDS: "60"
    volumes:
      - sqlite_data:/data
    ports:
      - "8002:8000"
    depends_on:
      api-1:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request;urllib.request.urlopen('http://127.0.0.1:8000/health',timeout=2)\""]
      interval: 3s
      timeout: 5s
      retries: 30

volumes:
  sqlite_data:
